services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-fabric}
      POSTGRES_USER: ${DB_USER:-fabric}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fabric}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
