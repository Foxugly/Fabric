# Fabric — single vhost: SPA, API and agent WebSocket all on one origin.
#
# Same-origin on purpose: the SPA derives its API base from window.location, so
# there is no CORS, no runtime-config sub_filter, and no cross-origin WebSocket
# to talk the origin validator out of (the trap poker hit, OPERATIONS.md §3.11).
#
# TLS: the shared wildcard lineage, never a per-subdomain certbot (§3.6).
# nginx 1.24 on the box wants the combined `listen 443 ssl http2;` form.

server {
    listen 80;
    listen [::]:80;
    server_name fabric.foxugly.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fabric.foxugly.com;

    ssl_certificate     /etc/letsencrypt/live/foxugly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foxugly.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/django_websites/Fabric/frontend/dist/fabric-frontend/browser;
    index index.html;

    # A terminal streams many small chunks: buffering them defeats the point.
    proxy_buffering off;
    client_max_body_size 4m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # AOT build, same-origin API: no inline script and no external host needed,
    # so no nonce and no 'unsafe-inline' (§3.6).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Agent + browser WebSockets. Kept isolated from `location /` (§3.11).
    location /ws/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Agents stay connected for hours between commands.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A Claude turn can legitimately take minutes.
        proxy_read_timeout 700s;
    }

    location = /health/ {
        access_log off;
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own static files (admin), collected by the deploy.
    location /static/ {
        alias /var/www/django_websites/Fabric/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Hashed Angular assets are immutable; index.html must never be cached or a
    # deploy stays invisible.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
