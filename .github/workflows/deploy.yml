name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fabric
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  DEPLOY_BUCKET: foxugly-deploy
  BUNDLE_PREFIX: builds/fabric-frontend

jobs:
  # `secrets` is not available in a job-level `if`, only in step `env` — hence
  # this tiny gate rather than a condition on the deploy job itself.
  gate:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$ROLE_ARN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS_DEPLOY_ROLE_ARN is unset - see deploy/ONBOARDING.md." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Backend
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check .
          mypy .
          python manage.py makemigrations --check --dry-run
          pytest -q
      - name: Agent
        working-directory: agent
        run: |
          pip install -e ".[dev]"
          ruff check .
          mypy .
          pytest -q

  deploy:
    needs: [gate, test]
    # Stays skipped until the OIDC role exists, so merging before the AWS side is
    # provisioned does not produce a red build (deploy/ONBOARDING.md).
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the SPA
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx ng build --configuration production

      - name: Pack the SPA
        run: tar -czf fabric-frontend.tar.gz -C frontend/dist/fabric-frontend/browser .

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload the bundle
        run: |
          aws s3 cp fabric-frontend.tar.gz \
            "s3://${DEPLOY_BUCKET}/${BUNDLE_PREFIX}/${GITHUB_SHA}.tar.gz"

      - name: Send the deploy command
        id: ssm
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          BUNDLE="s3://${DEPLOY_BUCKET}/${BUNDLE_PREFIX}/${GITHUB_SHA}.tar.gz"
          # The remote script lives in deploy/ssm-remote.sh so it stays
          # reviewable and free of YAML/heredoc quoting traps. jq --rawfile does
          # the JSON escaping.
          sed -e "s|__SHA__|${GITHUB_SHA}|g" -e "s|__BUNDLE__|${BUNDLE}|g" \
            deploy/ssm-remote.sh > /tmp/fabric-remote.sh
          jq -n --rawfile script /tmp/fabric-remote.sh \
            '{commands: [$script]}' > /tmp/fabric-params.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Fabric ${GITHUB_SHA:0:7}" \
            --timeout-seconds 600 \
            --parameters "file:///tmp/fabric-params.json" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command $COMMAND_ID"

      - name: Wait for the deploy to finish
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -euo pipefail
          STATUS=Pending
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
              *) sleep 10 ;;
            esac
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          ERRORS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text)
          if [ -n "$ERRORS" ] && [ "$ERRORS" != "None" ]; then
            echo "--- stderr ---"
            echo "$ERRORS"
          fi

          echo "final status: $STATUS"
          [ "$STATUS" = "Success" ]
