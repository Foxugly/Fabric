name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fabric
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  DEPLOY_BUCKET: foxugly-deploy
  BUNDLE_PREFIX: builds/fabric-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Backend
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check .
          mypy .
          python manage.py makemigrations --check --dry-run
          pytest -q
      - name: Agent
        working-directory: agent
        run: |
          pip install -e ".[dev]"
          ruff check .
          mypy .
          pytest -q

  deploy:
    needs: test
    # Stays skipped until the OIDC role exists, so merging this before the AWS
    # side is provisioned does not produce a red build (deploy/ONBOARDING.md).
    if: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the SPA
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx ng build --configuration production

      - name: Pack the SPA
        run: |
          tar -czf fabric-frontend.tar.gz \
            -C frontend/dist/fabric-frontend/browser .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload the bundle
        run: |
          aws s3 cp fabric-frontend.tar.gz \
            "s3://${DEPLOY_BUCKET}/${BUNDLE_PREFIX}/${GITHUB_SHA}.tar.gz"

      - name: Deploy on the box via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # NOTE: the commands below run as ROOT under /bin/sh (dash) with no
          # $HOME — hence `set -eu` (no pipefail), an explicit HOME, and
          # git safe.directory. See OPERATIONS.md §3.11.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Fabric ${GITHUB_SHA}" \
            --timeout-seconds 600 \
            --parameters commands="$(cat <<EOF
set -eu
export HOME=/root
APP_DIR=/var/www/django_websites/Fabric
BRANCH=main
BUNDLE=s3://${DEPLOY_BUCKET}/${BUNDLE_PREFIX}/${GITHUB_SHA}.tar.gz
SPA_DIR=\$APP_DIR/frontend/dist/fabric-frontend/browser

git config --global --get-all safe.directory | grep -qx "\$APP_DIR" \
  || git config --global --add safe.directory "\$APP_DIR"

echo "== sync code =="
cd "\$APP_DIR"
sudo -u django git fetch --prune origin "\$BRANCH"
sudo -u django git reset --hard "origin/\$BRANCH"

echo "== install root-loaded config from the git blob =="
git show "origin/\$BRANCH:deploy/fetch-env-from-ssm.sh" > /usr/local/sbin/fabric-env-fetch.sh
chown root:root /usr/local/sbin/fabric-env-fetch.sh
chmod 0755 /usr/local/sbin/fabric-env-fetch.sh
git show "origin/\$BRANCH:deploy/systemd/fabric-env-fetch.service" > /etc/systemd/system/fabric-env-fetch.service
git show "origin/\$BRANCH:deploy/systemd/fabric-asgi.service" > /etc/systemd/system/fabric-asgi.service
systemctl daemon-reload

echo "== install nginx vhost (with rollback guard) =="
VHOST=/etc/nginx/sites-available/fabric.foxugly.com
if [ -f "\$VHOST" ]; then cp -a "\$VHOST" "\$VHOST.deploybak"; fi
git show "origin/\$BRANCH:deploy/nginx/fabric.foxugly.com.conf" > "\$VHOST"
ln -sfn "\$VHOST" /etc/nginx/sites-enabled/fabric.foxugly.com
if nginx -t; then
  systemctl reload nginx
else
  echo "nginx -t failed, rolling the vhost back" >&2
  if [ -f "\$VHOST.deploybak" ]; then mv -f "\$VHOST.deploybak" "\$VHOST"; else rm -f "\$VHOST" /etc/nginx/sites-enabled/fabric.foxugly.com; fi
  nginx -t && systemctl reload nginx
  exit 1
fi

echo "== unpack the SPA =="
TMP=\$(mktemp -d)
aws s3 cp "\$BUNDLE" "\$TMP/spa.tar.gz" --region ${AWS_REGION}
sudo -u django mkdir -p "\$SPA_DIR"
tar -xzf "\$TMP/spa.tar.gz" -C "\$SPA_DIR" --no-same-owner
rm -rf "\$TMP"

echo "== backend deploy (as django) =="
sudo -u django bash "\$APP_DIR/deploy/ssm-deploy.sh"

echo "== restart =="
systemctl restart fabric-asgi

echo "== normalize perms (chown BEFORE chmod, §3.1) =="
chown -R django:www-data "\$APP_DIR"
chmod -R g-w,o-rwx "\$APP_DIR"

echo "== health =="
sleep 5
curl -fsS -o /dev/null -w '%{http_code}\n' https://fabric.foxugly.com/health/
EOF
)" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command $COMMAND_ID"

      - name: Wait for the deploy to finish
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text)
            case "$STATUS" in
              Success) echo "deploy succeeded"; break ;;
              Failed|Cancelled|TimedOut) echo "deploy $STATUS"; FAILED=1; break ;;
              *) sleep 10 ;;
            esac
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          ERRORS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text)
          if [ -n "$ERRORS" ] && [ "$ERRORS" != "None" ]; then
            echo "--- stderr ---"; echo "$ERRORS"
          fi
          if [ "${FAILED:-0}" = "1" ] || [ "${STATUS}" != "Success" ]; then
            exit 1
          fi
