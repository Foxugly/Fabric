name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # La suite tournait sur SQLite (DB_ENGINE absent -> branche sqlite dans
    # config/settings.py) alors que la production tourne sur PostgreSQL 16
    # (DB_ENGINE=postgresql sur la box). SQLite est plus permissif et laisse
    # passer des requetes que PostgreSQL refuse — c'est ainsi que deux endpoints
    # casses ont vecu en production sur QuizOnline sans qu'aucun test ne les
    # voie. On teste donc sur le moteur de production.
    env:
      # Convention DB_* 6 variables de la flotte (OPERATIONS.md §3.13).
      # Au niveau du job : les etapes migrations ET tests doivent voir la meme
      # base, sinon on verifie l'etat des migrations contre un autre moteur.
      DB_ENGINE: postgresql
      DB_NAME: fabric
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      # PostgreSQL n'est pas un `service` : un service se télécharge avant toute
      # étape, sans cache possible, et le registre refuse parfois (Docker Hub,
      # « Data limit exceeded » sur public.ecr.aws) — la CI échouait avant le
      # moindre test. L'image vit dans le cache d'Actions : un téléchargement par
      # mois au plus, trois tentatives, l'image du mois précédent en secours.
      - name: Clé du cache de l'image PostgreSQL (une par mois)
        id: cle-postgres
        run: echo "mois=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Image PostgreSQL depuis le cache
        id: cache-postgres
        uses: actions/cache/restore@v6
        with:
          path: /tmp/postgres-16.tar
          key: postgres-16-${{ steps.cle-postgres.outputs.mois }}
          restore-keys: postgres-16-

      - name: Image PostgreSQL depuis le registre (si le cache n'a pas celle du mois)
        id: telechargement-postgres
        if: steps.cache-postgres.outputs.cache-hit != 'true'
        run: |
          for essai in 1 2 3; do
            if docker pull public.ecr.aws/docker/library/postgres:16; then
              docker save public.ecr.aws/docker/library/postgres:16 -o /tmp/postgres-16.tar
              echo "neuve=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((essai * 20))
          done
          if [ -f /tmp/postgres-16.tar ]; then
            echo "::warning::Registre indisponible : image du cache d'un mois précédent."
          else
            echo "::error::Registre indisponible et aucune image en cache."
            exit 1
          fi

      - name: Mettre l'image du mois en cache
        if: steps.telechargement-postgres.outputs.neuve == 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/postgres-16.tar
          key: postgres-16-${{ steps.cle-postgres.outputs.mois }}

      - name: Démarrer PostgreSQL 16
        run: |
          docker load -i /tmp/postgres-16.tar
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=fabric \
            public.ecr.aws/docker/library/postgres:16
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then
              echo "PostgreSQL prêt."; exit 0
            fi
            sleep 2
          done
          docker logs postgres
          echo "::error::PostgreSQL ne répond pas."; exit 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Types
        working-directory: backend
        run: mypy .
      - name: Migrations are in sync with the models
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        working-directory: backend
        run: pytest -q

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: agent
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: agent
        run: ruff check .
      - name: Types
        working-directory: agent
        run: mypy .
      - name: Tests
        working-directory: agent
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Types
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npx ng build --configuration production

  # Audit des dépendances Python contre la base d'avis PyPI (OSV) : le job échoue
  # sur toute vulnérabilité connue. Fabric n'a pas de requirements.txt : le backend
  # et l'agent s'installent depuis pyproject (`pip install -e ".[dev]"`, plages de
  # versions, comme au déploiement). On audite donc l'ENVIRONNEMENT RÉSOLU de chacun
  # (dépendances transitives et extra dev compris) dans un venv jetable ; outil épinglé.
  # Exceptions : .pip-audit-ignore, une ligne « ID AAAA-MM-JJ # raison » ;
  # une exception expirée fait échouer le job — à réexaminer, pas à oublier.
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            agent/pyproject.toml

      - name: Install pip-audit (version figée)
        run: python -m pip install pip-audit==2.10.1

      - name: Audit des dépendances
        run: |
          ignore=()
          if [ -f .pip-audit-ignore ]; then
            today=$(date -u +%F)
            while read -r id expiry _ || [ -n "$id" ]; do
              case "$id" in ''|'#'*) continue ;; esac
              if [[ ! "$expiry" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                echo "::error::.pip-audit-ignore : date d'expiration manquante pour $id"; exit 1
              fi
              if [[ "$expiry" < "$today" ]]; then
                echo "::error::.pip-audit-ignore : l'exception $id a expiré le $expiry"; exit 1
              fi
              ignore+=(--ignore-vuln "$id")
            done < .pip-audit-ignore
          fi
          for projet in backend agent; do
            echo "::group::pip-audit $projet"
            python -m venv --upgrade-deps "/tmp/audit-$projet"
            "/tmp/audit-$projet/bin/pip" install --quiet -e "./$projet[dev]"
            pip-audit --progress-spinner off --skip-editable \
              --path "/tmp/audit-$projet/lib/python3.12/site-packages" "${ignore[@]}"
            echo "::endgroup::"
          done

  # Tests unitaires du SPA (vitest via @angular/build:unit-test, meme runner que
  # PushIT_frontend). Job separe pour garder le nom `frontend` stable dans les
  # checks requis ; a ajouter lui aussi aux checks requis de `main`.
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        run: npm run test:ci
